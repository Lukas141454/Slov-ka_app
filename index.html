<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback, useRef } = React;

// ---- tiny local storage wrapper mimicking the original window.storage API ----
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) return null;
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
};

// ---- minimal inline icon set (replacing lucide-react) ----
function Icon({ children, size = 18, color = "currentColor", className }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
      {children}
    </svg>
  );
}
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12" /></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></Icon>;
const RotateCcw = (p) => <Icon {...p}><polyline points="1 4 1 10 7 10" /><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" /></Icon>;

const ArrowLeftRight = (p) => <Icon {...p}><polyline points="17 1 21 5 17 9" /><path d="M3 11V9a4 4 0 0 1 4-4h14" /><polyline points="7 23 3 19 7 15" /><path d="M21 13v2a4 4 0 0 1-4 4H3" /></Icon>;

const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const BookOpen = (p) => <Icon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" /></Icon>;
const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></Icon>;
const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" /></Icon>;
const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9" /></Icon>;
const HelpCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
const Lightbulb = (p) => <Icon {...p}><path d="M9 18h6" /><path d="M10 22h4" /><path d="M12 2a6 6 0 0 0-4 10.5c.6.6 1 1.6 1 2.5h6c0-.9.4-1.9 1-2.5A6 6 0 0 0 12 2Z" /></Icon>;
const Volume2 = (p) => <Icon {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>;
const Package = (p) => <Icon {...p}><path d="m7.5 4.27 9 5.15" /><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" /><path d="m3.3 7 8.7 5 8.7-5" /><path d="M12 22V12" /></Icon>;
const HomeIcon = (p) => <Icon {...p}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /><polyline points="9 22 9 12 15 12 15 22" /></Icon>;
const ImageIcon = (p) => <Icon {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><circle cx="8.5" cy="8.5" r="1.5" /><polyline points="21 15 16 10 5 21" /></Icon>;

const INTERVALS = [1, 2, 4, 7, 14, 30, 60, 120];
const APP_VERSION = "v2.5 · 2026-09-04";
const STORAGE_KEY = "vocab-cards";
const SETTINGS_KEY = "vocab-settings";
const BACKUP_KEY = "vocab-last-backup";
const PACKS_KEY = "vocab-packs";
const UNSPLASH_KEY_STORAGE = "vocab-unsplash-key";

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}
function addDays(base, days) {
  const d = new Date(base + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// Strips diacritics and lowercases, so "jiz" matches "již" and searching
// works as a real fulltext match anywhere in the word, not just the start.
function normalizeSearch(str) {
  return (str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

// Speaks an English word/phrase aloud using the browser's built-in
// text-to-speech (Web Speech API). Works offline, no API key needed.
function speakEnglish(text) {
  if (!text) return;
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.cancel(); // stop anything currently playing
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 0.95;
    window.speechSynthesis.speak(utterance);
  } catch (e) {
    console.warn("Speech synthesis failed:", e);
  }
}

// Some browsers (especially Chrome) initialize the text-to-speech engine
// lazily, which causes a noticeable delay on the very first use after the
// app loads. Calling getVoices() early — and speaking a near-silent
// utterance — nudges the browser to warm the engine up in the background,
// so by the time the person actually taps the speaker button it's ready.
function warmUpSpeechSynthesis() {
  if (!("speechSynthesis" in window)) return;
  try {
    window.speechSynthesis.getVoices();
    const warmup = new SpeechSynthesisUtterance(" ");
    warmup.volume = 0;
    warmup.lang = "en-US";
    window.speechSynthesis.speak(warmup);
    // Chrome sometimes loads the voice list asynchronously — ask again once it's ready.
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  } catch (e) {
    // non-fatal — worst case the first tap is just slightly slower
  }
}

// A card can have different memorization progress in each direction
// (e.g. you know it well cz->en but not yet en->cz). Progress is stored
// per direction key: "en-cz" and "cz-en".
function getProgress(card, direction) {
  const base = { level: null, nextDue: null, lastReviewed: null, dontCount: 0 };
  if (card.progress && card.progress[direction]) return { ...base, ...card.progress[direction] };
  return base;
}
function withProgress(card, direction, patch) {
  const current = getProgress(card, direction);
  return {
    ...card,
    progress: {
      ...(card.progress || {}),
      [direction]: { ...current, ...patch },
    },
  };
}
// Older cards were saved with a single flat level/nextDue/lastReviewed
// shared by both directions. Migrate them into the new per-direction shape,
// using the old values as the starting point for both directions.
function migrateCard(c) {
  if (c.progress) return c;
  const legacy = { level: c.level ?? null, nextDue: c.nextDue ?? null, lastReviewed: c.lastReviewed ?? null };
  return {
    ...c,
    progress: {
      "en-cz": { ...legacy },
      "cz-en": { ...legacy },
    },
  };
}

function VocabApp() {
  const [screen, setScreen] = useState("home");
  const [cards, setCards] = useState(null);
  const [settings, setSettings] = useState({ direction: "en-cz" });
  const [loaded, setLoaded] = useState(false);
  const [packs, setPacks] = useState([]);

  const [rawText, setRawText] = useState("");
  const [draftCards, setDraftCards] = useState([]);
  const [packName, setPackName] = useState("");

  const [queue, setQueue] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [hintLevel, setHintLevel] = useState(0);
  const [sessionStats, setSessionStats] = useState({ know: 0, almost: 0, dont: 0 });
  const [lastAction, setLastAction] = useState(null);
  const [lastBackupAt, setLastBackupAt] = useState(null);
  const [problemQueue, setProblemQueue] = useState([]);
  const [problemIndex, setProblemIndex] = useState(0);
  const [problemFlipped, setProblemFlipped] = useState(false);
  const [unsplashKey, setUnsplashKey] = useState("");
  const [unsplashKeyInput, setUnsplashKeyInput] = useState("");
  const [showUnsplashSettings, setShowUnsplashSettings] = useState(false);
  const [imageLoadingId, setImageLoadingId] = useState(null);
  const [imageErrorId, setImageErrorId] = useState(null);

  function startProblemReview() {
    const list = getProblemCards(settings.direction).map((x) => x.card);
    if (list.length === 0) return;
    setProblemQueue(list);
    setProblemIndex(0);
    setProblemFlipped(false);
    setHintLevel(0);
    setScreen("problemReview");
  }
  function nextProblemCard() {
    setProblemIndex((i) => Math.min(i + 1, problemQueue.length - 1));
    setProblemFlipped(false);
    setHintLevel(0);
  }
  function prevProblemCard() {
    setProblemIndex((i) => Math.max(i - 1, 0));
    setProblemFlipped(false);
    setHintLevel(0);
  }

  const [updateAvailable, setUpdateAvailable] = useState(false);

  useEffect(() => {
    warmUpSpeechSynthesis();
  }, []);

  useEffect(() => {
    async function checkForUpdate() {
      try {
        const res = await fetch("./index.html", { cache: "no-store" });
        const text = await res.text();
        const match = text.match(/const APP_VERSION = "([^"]+)"/);
        if (match && match[1] !== APP_VERSION) {
          setUpdateAvailable(true);
        }
      } catch (e) {
        // offline or request failed — silently ignore, we'll try again later
      }
    }
    checkForUpdate();
    function onVisible() {
      if (document.visibilityState === "visible") checkForUpdate();
    }
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", checkForUpdate);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", checkForUpdate);
    };
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const c = await window.storage.get(STORAGE_KEY);
        setCards(c ? JSON.parse(c.value).map(migrateCard) : []);
      } catch {
        setCards([]);
      }
      try {
        const s = await window.storage.get(SETTINGS_KEY);
        if (s) setSettings(JSON.parse(s.value));
      } catch {}
      try {
        const b = await window.storage.get(BACKUP_KEY);
        if (b) setLastBackupAt(b.value);
      } catch {}
      try {
        const p = await window.storage.get(PACKS_KEY);
        setPacks(p ? JSON.parse(p.value) : []);
      } catch {
        setPacks([]);
      }
      try {
        const u = await window.storage.get(UNSPLASH_KEY_STORAGE);
        if (u) {
          setUnsplashKey(u.value);
          setUnsplashKeyInput(u.value);
        }
      } catch {}
      setLoaded(true);
    })();
  }, []);

  const saveCards = useCallback(async (next) => {
    setCards(next);
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  const savePacks = useCallback(async (next) => {
    setPacks(next);
    try {
      await window.storage.set(PACKS_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  function saveUnsplashKey() {
    const key = unsplashKeyInput.trim();
    setUnsplashKey(key);
    window.storage.set(UNSPLASH_KEY_STORAGE, key).catch(() => {});
  }

  async function fetchProblemImage(card, forceNext) {
    if (!unsplashKey) return;
    setImageLoadingId(card.id);
    setImageErrorId(null);

    // "Zkusit jiný obrázek" cycles through already-fetched candidates first,
    // instead of re-running the exact same search (which always returns #1 again)
    if (forceNext && card.imageOptions && card.imageOptions.length > 0) {
      const nextIndex = ((card.imageIndex || 0) + 1) % card.imageOptions.length;
      const photo = card.imageOptions[nextIndex];
      if (photo.links && photo.links.download_location) {
        fetch(`${photo.links.download_location}&client_id=${unsplashKey}`).catch(() => {});
      }
      saveCards(
        cards.map((c) =>
          c.id === card.id
            ? {
                ...c,
                imageIndex: nextIndex,
                image: {
                  url: photo.urls.small,
                  photographerName: photo.user.name,
                  photographerUrl: `${photo.user.links.html}?utm_source=Ucilky&utm_medium=referral`,
                },
              }
            : c
        )
      );
      setImageLoadingId(null);
      return;
    }

    try {
      const res = await fetch(
        `https://api.unsplash.com/search/photos?query=${encodeURIComponent(card.en)}&per_page=6&client_id=${unsplashKey}`
      );
      if (!res.ok) throw new Error("Unsplash request failed");
      const data = await res.json();
      const results = data.results || [];
      if (results.length === 0) {
        setImageErrorId(card.id);
        setImageLoadingId(null);
        return;
      }
      const photo = results[0];
      const image = {
        url: photo.urls.small,
        photographerName: photo.user.name,
        photographerUrl: `${photo.user.links.html}?utm_source=Ucilky&utm_medium=referral`,
      };
      // Unsplash API guidelines require pinging this endpoint whenever a photo is used
      if (photo.links && photo.links.download_location) {
        fetch(`${photo.links.download_location}&client_id=${unsplashKey}`).catch(() => {});
      }
      saveCards(
        cards.map((c) =>
          c.id === card.id ? { ...c, image, imageOptions: results, imageIndex: 0 } : c
        )
      );
    } catch (e) {
      setImageErrorId(card.id);
    }
    setImageLoadingId(null);
  }

  function removeProblemImage(card) {
    saveCards(
      cards.map((c) => {
        if (c.id !== card.id) return c;
        const { image, imageOptions, imageIndex, ...rest } = c;
        return rest;
      })
    );
  }

  const saveSettings = useCallback(async (next) => {
    setSettings(next);
    try {
      await window.storage.set(SETTINGS_KEY, JSON.stringify(next));
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  const dueCount = cards
    ? cards.filter((c) => {
        const p = getProgress(c, settings.direction);
        return p.nextDue === null || p.nextDue <= todayStr();
      }).length
    : 0;

  function getProblemCards(direction) {
    const today = todayStr();
    return (cards || [])
      .map((c) => {
        const p = getProgress(c, direction);
        const lvl = p.level === null || p.level === undefined ? -1 : p.level;
        const daysSinceCreated = Math.floor(
          (new Date(today) - new Date(c.createdAt || today)) / 86400000
        );
        const dontCount = p.dontCount || 0;
        const stuckLow = lvl <= 2 && daysSinceCreated >= 14;
        const manyDont = dontCount >= 2;
        return { card: c, dontCount, stuckLow, manyDont, daysSinceCreated };
      })
      .filter((x) => x.manyDont || x.stuckLow)
      .sort((a, b) => b.dontCount - a.dontCount || b.daysSinceCreated - a.daysSinceCreated);
  }

  function updateNote(id, note) {
    saveCards(cards.map((c) => (c.id === id ? { ...c, note } : c)));
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startReview() {
    const today = todayStr();
    const due = shuffle(
      cards.filter((c) => {
        const p = getProgress(c, settings.direction);
        return p.nextDue === null || p.nextDue <= today;
      })
    ).slice(0, 20);
    setQueue(due);
    setQIndex(0);
    setFlipped(false);
    setHintLevel(0);
    setSessionStats({ know: 0, almost: 0, dont: 0 });
    setLastAction(null);
    setScreen("review");
  }

  function answer(result) {
    const card = queue[qIndex];
    const direction = settings.direction;
    const prog = getProgress(card, direction);
    const level = prog.level === null || prog.level === undefined ? -1 : prog.level;
    let newLevel = level;
    let nextDue;
    if (result === "know") {
      newLevel = Math.min(level + 1, INTERVALS.length - 1);
      nextDue = addDays(todayStr(), INTERVALS[newLevel]);
    } else if (result === "almost") {
      newLevel = Math.max(level, 0);
      const iv = INTERVALS[newLevel];
      nextDue = addDays(todayStr(), Math.max(1, Math.ceil(iv / 2)));
    } else {
      newLevel = 0;
      nextDue = addDays(todayStr(), 1);
    }

    // track how many times this word has recently tripped you up, so we
    // can surface "problem words" — reset on a solid "know", tick up on "dont"
    let newDontCount = prog.dontCount || 0;
    if (result === "dont") newDontCount += 1;
    if (result === "know") newDontCount = 0;

    // remember previous state of this exact card+direction so we can undo one step back
    setLastAction({
      cardId: card.id,
      direction,
      prevLevel: prog.level,
      prevNextDue: prog.nextDue,
      prevLastReviewed: prog.lastReviewed,
      prevDontCount: prog.dontCount || 0,
      result,
      qIndexAtAnswer: qIndex,
    });

    const updated = cards.map((c) =>
      c.id === card.id
        ? withProgress(c, direction, { level: newLevel, nextDue, lastReviewed: todayStr(), dontCount: newDontCount })
        : c
    );
    saveCards(updated);
    setSessionStats((s) => ({
      ...s,
      know: s.know + (result === "know" ? 1 : 0),
      almost: s.almost + (result === "almost" ? 1 : 0),
      dont: s.dont + (result === "dont" ? 1 : 0),
    }));

    if (qIndex + 1 >= queue.length) {
      setScreen("summary");
    } else {
      setQIndex((i) => i + 1);
      setFlipped(false);
    setHintLevel(0);
    }
  }

  function undoLastAnswer() {
    if (!lastAction) return;
    const { cardId, direction, prevLevel, prevNextDue, prevLastReviewed, prevDontCount, result, qIndexAtAnswer } = lastAction;
    const updated = cards.map((c) =>
      c.id === cardId
        ? withProgress(c, direction, {
            level: prevLevel,
            nextDue: prevNextDue,
            lastReviewed: prevLastReviewed,
            dontCount: prevDontCount ?? 0,
          })
        : c
    );
    saveCards(updated);
    setSessionStats((s) => ({
      ...s,
      know: s.know - (result === "know" ? 1 : 0),
      almost: s.almost - (result === "almost" ? 1 : 0),
      dont: s.dont - (result === "dont" ? 1 : 0),
    }));
    setQIndex(qIndexAtAnswer);
    setFlipped(false);
    setHintLevel(0);
    setLastAction(null);
    setScreen("review");
  }

  const [deleteConfirmId, setDeleteConfirmId] = useState(null);

  function quickPromote(targetLevel) {
    const card = queue[qIndex];
    if (!card) return;
    const direction = settings.direction;
    const prog = getProgress(card, direction);
    const currentLevel = prog.level === null || prog.level === undefined ? -1 : prog.level;

    // Never downgrade — if the card is already at or above the target level
    // (and thus already scheduled further out), just move on without touching it.
    if (currentLevel < targetLevel) {
      const nextDue = addDays(todayStr(), INTERVALS[targetLevel]);
      setLastAction({
        cardId: card.id,
        direction,
        prevLevel: prog.level,
        prevNextDue: prog.nextDue,
        prevLastReviewed: prog.lastReviewed,
        prevDontCount: prog.dontCount || 0,
        result: "skip",
        qIndexAtAnswer: qIndex,
      });
      const updated = cards.map((c) =>
        c.id === card.id
          ? withProgress(c, direction, { level: targetLevel, nextDue, lastReviewed: todayStr(), dontCount: 0 })
          : c
      );
      saveCards(updated);
    }

    if (qIndex + 1 >= queue.length) {
      setScreen("summary");
    } else {
      setQIndex((i) => i + 1);
      setFlipped(false);
    setHintLevel(0);
    }
  }

  function requestDeleteCurrentCard() {
    const card = queue[qIndex];
    if (!card) return;
    setDeleteConfirmId(card.id);
  }
  function cancelDeleteCurrentCard() {
    setDeleteConfirmId(null);
  }
  function confirmDeleteCurrentCard() {
    const id = deleteConfirmId;
    if (!id) return;
    saveCards(cards.filter((c) => c.id !== id));
    if (lastAction && lastAction.cardId === id) {
      setLastAction(null);
    }
    const newQueue = queue.filter((c) => c.id !== id);
    setQueue(newQueue);
    setFlipped(false);
    setHintLevel(0);
    setDeleteConfirmId(null);
    if (newQueue.length === 0 || qIndex >= newQueue.length) {
      setScreen("summary");
    }
  }

  function parseLinesIntoDraft(text) {
    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    let invalidCount = 0;
    const parsed = lines.map((line) => {
      // preferred fast format: "apple.jablko" (split at first dot)
      const dotIdx = line.indexOf(".");
      if (dotIdx > 0 && dotIdx < line.length - 1) {
        return {
          _id: uid(),
          en: line.slice(0, dotIdx).trim(),
          cz: line.slice(dotIdx + 1).trim(),
          invalid: false,
        };
      }
      // fallback: old "apple - jablko" format, in case of pasted lists
      const parts = line.split(/\s+[-–—]\s+/);
      if (parts.length >= 2) {
        return { _id: uid(), en: parts[0].trim(), cz: parts.slice(1).join(" - ").trim(), invalid: false };
      }
      // couldn't recognize the format — keep the raw line visible so it can be fixed,
      // instead of silently dropping it
      invalidCount++;
      return { _id: uid(), en: line, cz: "", invalid: true };
    });
    setDraftCards((prev) => [...prev, ...parsed]);
    return { addedCount: parsed.length - invalidCount, invalidCount };
  }

  function parseText() {
    const { invalidCount } = parseLinesIntoDraft(rawText);
    setRawText("");
    if (invalidCount > 0) {
      setFileError(
        `${invalidCount} ${invalidCount === 1 ? "řádek se nepodařilo rozpoznat" : "řádků se nepodařilo rozpoznat"} — je označený červeně v náhledu níže, oprav ho nebo smaž.`
      );
    } else {
      setFileError("");
    }
  }

  const [fileError, setFileError] = useState("");

  function handleFileUpload(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setFileError("");
    if (!packName.trim()) {
      const base = file.name.replace(/\.[^/.]+$/, "");
      setPackName(base || "Nový balíček");
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const text = ev.target.result;
      const { addedCount, invalidCount } = parseLinesIntoDraft(text);
      if (addedCount === 0 && invalidCount === 0) {
        setFileError("Soubor je prázdný.");
      } else if (invalidCount > 0) {
        setFileError(
          `${invalidCount} řádek se nepodařilo rozpoznat — jsou označené červeně v náhledu níže, oprav je nebo smaž.`
        );
      }
    };
    reader.onerror = () => setFileError("Soubor se nepodařilo přečíst.");
    reader.readAsText(file, "UTF-8");
  }

  function updateDraft(id, field, value) {
    setDraftCards((prev) => prev.map((c) => (c._id === id ? { ...c, [field]: value, invalid: false } : c)));
  }
  function removeDraft(id) {
    setDraftCards((prev) => prev.filter((c) => c._id !== id));

  function confirmPackDraft() {
    const clean = draftCards.filter((c) => c.en.trim() && c.cz.trim());
    const incomplete = draftCards.filter((c) => !(c.en.trim() && c.cz.trim()));
    if (clean.length > 0) {
      const name = packName.trim() || `Balíček ${packs.length + 1}`;
      const newPack = {
        id: uid(),
        name,
        createdAt: todayStr(),
        activatedAt: null,
        words: clean.map((c) => ({ en: c.en.trim(), cz: c.cz.trim() })),
      };
      savePacks([...(packs || []), newPack]);
    }
    // keep incomplete/invalid rows so they can still be fixed — only clear what was saved
    setDraftCards(incomplete);
    if (incomplete.length === 0) {
      setPackName("");

    savePacks(packs.map((p) => (p.id === pack.id ? { ...p, activatedAt: todayStr() } : p)));

  function shouldShowBackupReminder() {
    if (!cards || cards.length === 0) return false;
    if (reminderDismissed) return false;
    if (!lastBackupAt) return true;
    const daysSince = (new Date(todayStr()) - new Date(lastBackupAt)) / 86400000;
    return daysSince >= 7;

  const [pendingImport, setPendingImport] = useState(null);
  const [importError, setImportError] = useState("");

  function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setImportError("");
    setPendingImport(null);
    setPendingImportPacks(null);
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const importedCards = Array.isArray(data) ? data : data.cards;
        if (!Array.isArray(importedCards)) {
          setImportError("Soubor nemá platný formát zálohy.");
          return;
        }
        const clean = importedCards
          .filter((c) => c && typeof c.en === "string" && typeof c.cz === "string")
          .map((c) => {
            const base = {
              id: c.id || uid(),
              en: c.en.trim(),
              cz: c.cz.trim(),
              createdAt: c.createdAt || todayStr(),
              ...(c.note ? { note: c.note } : {}),
              ...(c.image ? { image: c.image } : {}),
            };
            if (c.progress && c.progress["en-cz"] && c.progress["cz-en"]) {
              return { ...base, progress: c.progress };
            }
            // legacy flat format: apply same starting progress to both directions
            const legacy = {
              level: typeof c.level === "number" ? c.level : null,
              nextDue: c.nextDue || null,
              lastReviewed: c.lastReviewed || null,
            };
            return { ...base, progress: { "en-cz": { ...legacy }, "cz-en": { ...legacy } } };
          });
        if (clean.length === 0) {
          setImportError("V souboru nejsou žádná platná slovíčka.");
          return;
        }
        setPendingImport(clean);
        if (Array.isArray(data.packs)) {
          setPendingImportPacks(data.packs);
        }
      } catch (err) {
        setImportError("Soubor se nepodařilo přečíst — není to platný JSON export.");
      }
    };
    reader.onerror = () => setImportError("Soubor se nepodařilo přečíst.");
    reader.readAsText(file, "UTF-8");
  }

    if (!pendingImport) return;
    if (mode === "replace") {

    } else {
      const existingKey = (c) => `${c.en.toLowerCase()}|${c.cz.toLowerCase()}`;
      const existingSet = new Set((cards || []).map(existingKey));
      const toAdd = pendingImport.filter((c) => !existingSet.has(existingKey(c)));
      saveCards([...(cards || []), ...toAdd]);
      if (pendingImportPacks) {
        const existingPackIds = new Set((packs || []).map((p) => p.id));
        const newPacks = pendingImportPacks.filter((p) => !existingPackIds.has(p.id));
        savePacks([...(packs || []), ...newPacks]);
      }
    }
    setPendingImport(null);
    setPendingImportPacks(null);
  }

  if (!loaded) {
    return (
      <div className="vf-root">
        <style>{styles}</style>
        <div className="vf-loading">
          <Loader2 size={28} />

  return (
    <div className="vf-root">

      {updateAvailable && (

      {screen === "home" && (

          <div className="vf-header">
            <div>

          <div className="vf-body">
            {shouldShowBackupReminder() && (
              <div className="vf-reminder">

                <div className="vf-reminder-actions">
                  <button className="vf-reminder-btn primary" onClick={exportCards}>Zálohovat teď</button>
                  <button className="vf-reminder-btn" onClick={() => setReminderDismissed(true)}>Později</button>
                </div>
              </div>
            )}
            <div className="vf-stat-row">
              <div className="vf-stat">
                <b>{cards.length}</b>
                <span>Celkem</span>

              <div className="vf-stat">

                <span>K opakování</span>

            <button className="vf-btn secondary" onClick={() => setScreen("add")}>
              <Plus size={18} /> Přidat slovíčka
            </button>
            {getProblemCards(settings.direction).length > 0 && (

              </button>

              onClick={() => saveSettings({ ...settings, direction: settings.direction === "en-cz" ? "cz-en" : "en-cz" })}
            >
              <ArrowLeftRight size={14} />
              Směr: {settings.direction === "en-cz" ? "anglicky → česky" : "česky → anglicky"}
            </div>

            {cards.length === 0 && (
              <div className="vf-empty">Zatím žádné kartičky. Přidej první slovíčka.</div>
            )}

            <div className="vf-version">{APP_VERSION}</div>
          </div>
        </>
      )}

      {screen === "problems" && (
        <>
          <div className="vf-header">
            <button className="vf-icon-btn" onClick={() => setScreen("home")}><ArrowLeft size={20} color="#1e3a5f" /></button>
            <div className="vf-title" style={{ fontSize: 26 }}>Problémová slovíčka</div>
            <div style={{ width: 20 }} />

            {getProblemCards(settings.direction).length > 0 && (
              <button className="vf-btn" style={{ marginBottom: 18, marginTop: 16 }} onClick={startProblemReview}>

                <div className="vf-problem-badges">

                </div>

                  <div className="vf-problem-image-area">

                        </div>

                    ) : (
                      <button
                        className="vf-btn secondary"
                        style={{ width: "auto", padding: "8px 14px", fontSize: 13, marginBottom: 6 }}

                        <ImageIcon size={15} /> {imageLoadingId === c.id ? "Hledám…" : "Najít obrázek"}
                      </button>

                      <p style={{ fontSize: 11.5, color: "#b23a2e", margin: "2px 0 6px" }}>

                      </p>
                    )}
                  </div>
                )}

                <input
                  className="vf-problem-note"
                  value={c.note || ""}
                  onChange={(e) => updateNote(c.id, e.target.value)}
                  placeholder="Tvoje mnemotechnická pomůcka…"

              <p>
                Každé slovíčko postupuje úrovněmi 1 až 8. Čím vyšší úroveň, tím delší pauza,
                než se ti slovíčko znovu objeví — appka věří, že ho umíš stále líp.

              <p>
                Nové slovíčko čeká na úrovni <b>„Nové“</b>. Jakmile ho poprvé úspěšně zodpovíš,
                přeskočí na Level 1 a naplánuje se na příště za 1 den. Dál to pokračuje takto:
              </p>
              <table className="vf-help-table">
                <tbody>
                  <tr><td>Level 1</td><td>za 1 den</td></tr>
                  <tr><td>Level 2</td><td>za 2 dny</td></tr>
                  <tr><td>Level 3</td><td>za 4 dny</td></tr>
                  <tr><td>Level 4</td><td>za 7 dní</td></tr>
                  <tr><td>Level 5</td><td>za 14 dní</td></tr>
                  <tr><td>Level 6</td><td>za 30 dní</td></tr>
                  <tr><td>Level 7</td><td>za 60 dní</td></tr>
                  <tr><td>Level 8 (max)</td><td>za 120 dní</td></tr>
                </tbody>
              </table>

            <div className="vf-help-section">

              <p><b style={{ color: "#3f7d52" }}>Znám</b> — slovíčko postoupí o jednu úroveň výš a dostane delší pauzu podle tabulky nahoře.</p>
              <p><b style={{ color: "#c68a2b" }}>Skoro</b> — úroveň zůstane stejná, ale slovíčko se vrátí dřív — za polovinu intervalu dané úrovně (např. na Level 5 za 7 dní místo 14).</p>

                zvýší úroveň. Během opakování můžeš kartičku poslat rovnou na Level 4 (za týden),
                Level 5 (za 14 dní), Level 6 (za 30 dní) nebo Level 7 (za 60 dní).
              </p>
              <p>
                Appka nikdy úroveň nesníží — pokud je slovíčko už na vyšší úrovni, než na jakou ho
                zkusíš poslat, nic se nezmění a appka jen pokračuje na další kartičku.

              <p>
                Appka sleduje pokrok zvlášť pro směr česky→anglicky a zvlášť pro anglicky→česky.
                Slovíčko, které umíš skvěle jedním směrem, může být v opačném směru na jiné (nižší) úrovni.

                zpět. Slovíčko, které umíš na 100 % a už ho nechceš vůbec opakovat, jde z appky

            <div className="vf-help-section">
              <h3>Nápověda</h3>

                Než kartičku otočíš, můžeš klepnout na tlačítko „Nápověda" vpravo nahoře — odkryje

                dál, dokud si nevzpomeneš nebo neuvidíš celé slovo.
              </p>
              <p>
                Aktivní vybavování si s malou nápovědou totiž posiluje paměť víc než pasivní
                přečtení odpovědi (tzv. testovací efekt) — a mírná obtížnost při učení je žádoucí,
                ne na škodu (koncept „desirable difficulties" psychologa Roberta Bjorka).
              </p>

                        className="vf-hint-corner-btn"
                        disabled={hintLevel >= back.length}
                        onClick={(e) => { e.stopPropagation(); nextHintLetterProblem(); }}
                      >
                        <Lightbulb size={15} /> Nápověda
                      </button>
                    )}
                    <div className="vf-word">{front}</div>
                    {settings.direction === "en-cz" && (
                      <button
                        className="vf-speak-btn"
                        onClick={(e) => { e.stopPropagation(); speakEnglish(card.en); }}
                        title="Přehrát výslovnost"
                      >
                        <Volume2 size={26} />
                      </button>
                    )}
                    {hintLevel > 0 && <div className="vf-hint-letters">{hintDisplay}</div>}
                  </div>
                  <div className="vf-face back">
                    <span className="vf-tag">{settings.direction === "en-cz" ? "CZ" : "EN"}</span>
                    <div className="vf-word">{back}</div>
                    {settings.direction === "cz-en" && (
                      <button
                        className="vf-speak-btn"
                        onClick={(e) => { e.stopPropagation(); speakEnglish(card.en); }}
                        title="Přehrát výslovnost"
                      >
                        <Volume2 size={26} />
                      </button>
                    )}
                  </div>
                </div>
              </div>
              {!problemFlipped && (
                <div className="vf-hint-big-wrap">
                  <button
                    className="vf-hint-big-btn"
                    disabled={hintLevel >= back.length}
                    onClick={() => nextHintLetterProblem()}
                  >
                    <Lightbulb size={38} />
                  </button>
                </div>
              )}
              {problemFlipped && card.image && (
                <>
                  <img src={card.image.url} alt={card.en} className="vf-problem-image-review" />
                  <button className="vf-image-remove-link" onClick={() => removeProblemImage(card)}>
                    <Trash2 size={12} /> Smazat obrázek
                  </button>
                </>
              )}
              {problemFlipped && card.note && (
                <p style={{ fontSize: 12.5, color: "#4a6580", textAlign: "center", marginTop: 4, marginBottom: 16 }}>
                  💡 {card.note}
                </p>
              )}
              {problemFlipped && (
                <div className="vf-problem-nav-row">
                  <button className="vf-btn secondary" style={{ marginBottom: 0 }} disabled={problemIndex === 0} onClick={prevProblemCard}>
                    <ArrowLeft size={18} /> Předchozí
                  </button>
                  <button className="vf-btn secondary" style={{ marginBottom: 0 }} disabled={problemIndex >= problemQueue.length - 1} onClick={nextProblemCard}>
                    Další <ArrowRight size={18} />
                  </button>
                </div>
              )}
              {problemIndex >= problemQueue.length - 1 && (
                <button className="vf-btn secondary" style={{ marginTop: 16 }} onClick={() => setScreen("problems")}>
                  Zpět na problémová slovíčka
                </button>
              )}
            </div>
          </>
        );
      })()}

      {screen === "summary" && (
        <>
          <div className="vf-header">
            <div className="vf-title">Hotovo!</div>
            <div style={{ width: 20 }} />
          </div>
          <div className="vf-body">
            <div className="vf-summary-stat">
              <div><b style={{ color: "#3f7d52" }}>{sessionStats.know}</b>znám</div>
              <div><b style={{ color: "#c68a2b" }}>{sessionStats.almost}</b>skoro</div>
              <div><b style={{ color: "#b23a2e" }}>{sessionStats.dont}</b>neznám</div>
            </div>
            <p style={{ fontSize: 13, color: "#4a6580", textAlign: "center", marginBottom: 24 }}>
              Ta, co jsi neznal, se vrátí zítra. Ta, co znáš dobře, se vrátí až za pár dní.
            </p>
            {lastAction && (
              <button className="vf-undo-btn" style={{ marginBottom: 12 }} onClick={undoLastAnswer}>
                <RotateCcw size={14} /> Vrátit poslední odpověď
              </button>
            )}
            <button className="vf-btn" onClick={() => setScreen("home")}>Zpět na start</button>
          </div>
        </>
      )}

      {(screen === "home" || screen === "list" || screen === "packs" || screen === "backup") && (
        <div className="vf-bottom-nav">
          <button className={`vf-bottom-nav-item${screen === "home" ? " active" : ""}`} onClick={() => setScreen("home")}>
            <HomeIcon size={20} />
            Domů
          </button>
          <button className={`vf-bottom-nav-item${screen === "list" ? " active" : ""}`} onClick={() => setScreen("list")}>
            <BookOpen size={20} />
            Seznam
          </button>
          <button className={`vf-bottom-nav-item${screen === "packs" ? " active" : ""}`} onClick={() => setScreen("packs")}>
            <Package size={20} />
            Balíčky
          </button>
          <button className={`vf-bottom-nav-item${screen === "backup" ? " active" : ""}`} onClick={() => setScreen("backup")}>
            <Download size={20} />
            Záloha
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VocabApp />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
</body>
</html>
